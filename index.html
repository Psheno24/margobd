<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#6ec8e8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Только для Марго</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="sky" aria-hidden="true">
      <i class="cloud c1"></i>
      <i class="cloud c2"></i>
      <i class="cloud c3"></i>
      <i class="cloud c4"></i>
    </div>
    <div class="meadow" aria-hidden="true"></div>
    <canvas class="confetti" id="confetti"></canvas>
    <main id="app"></main>
    <div class="lightbox hidden" id="lightbox" hidden>
      <div class="lightbox-inner">
        <p class="lightbox-kicker">код подарка</p>
        <h2 class="lightbox-title" id="lightbox-title"></h2>
        <img id="lightbox-img" alt="" />
        <button class="btn btn-solid lightbox-close" type="button" data-close-code>Закрыть</button>
      </div>
    </div>
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
